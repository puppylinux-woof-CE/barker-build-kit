name: Build Custom Fedora KDE RootFS (Testing)

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged # Necessary for mounting and chroot operations

    steps:
      - name: Install Host Build Dependencies
        run: |
          dnf install -y wget tar xz squashfs-tools dnf-plugins-core \
          gcc gcc-c++ make automake autoconf gtk2-devel gtk3-devel \
          libxml2-devel glib2-devel git passwd busybox

      - name: Initialize RootFS Directory
        run: |
          mkdir -p ./build-rootfs
          # Bootstrap the base system
          dnf --installroot=$(pwd)/build-rootfs --use-host-config --releasever=43 install -y \
          @core systemd basesystem fedora-release dnf

      - name: Install KDE Plasma and Core Features
        run: |
          dnf install @kde-desktop --installroot=$(pwd)/build-rootfs -y 

      - name: Install VPN Plugins and Drivers
        run: |
          dnf --installroot=$(pwd)/build-rootfs install -y --skip-unavailable \
          NetworkManager-sstp NetworkManager-pptp NetworkManager-l2tp \
          NetworkManager-libreswan NetworkManager-openvpn NetworkManager-wireguard \
          mesa-dri-drivers mesa-vulkan-drivers mesa-va-drivers mesa-vdpau-drivers

      - name: Install Application Suite
        run: |
          # Adding RPM Fusion for Amarok and multimedia support if needed
          dnf --installroot=$(pwd)/build-rootfs install -y \
          https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
          
          dnf --installroot=$(pwd)/build-rootfs install -y --skip-unavailable \
          kwave krecord skanlite kamera k3b ark kate yad flatpak \
          konqueror falkon haruna gwenview gparted filelight discover cups gutenprint

      - name: Compile Legacy Tools (gtkdialog, Xdialog, gxmessage, systemgenie)
        run: |
          ROOTFS_DIR=$(pwd)/build-rootfs
          
          # Helper function to build and install to rootfs
          build_tool() {
            git clone "$1" build_dir || wget "$2" -O build.tar.gz
            [ -f build.tar.gz ] && tar -xvf build.tar.gz && cd "$(ls -d */ | head -1)" || cd build_dir
            ./configure --prefix=/usr || ./autogen.sh --prefix=/usr
            make -j$(nproc)
            make DESTDIR=$ROOTFS_DIR install
            cd ../ && rm -rf build_dir build.tar.gz
          }

          # Build requirements
          build_tool "https://github.com/01micko/gtkdialog.git"
          build_tool "" "https://github.com/v1ne/Xdialog/archive/refs/tags/v2.3.1.tar.gz"
          build_tool "" "https://ftp.gnu.org/gnu/gxmessage/gxmessage-3.0.1.tar.gz"

      - name: Configure Users and Passwords
        run: |
          # Create user puppy
          chroot ./build-rootfs useradd -m -G wheel -p $(openssl passwd -1 puppy) puppy
          # Set root password
          echo "root:woofwoof" | chroot ./build-rootfs chpasswd
          # Enable Pipewire-JACK
          chroot ./build-rootfs ln -sf /usr/share/doc/pipewire-jack-audio-connection-kit/ld.so.conf.d/pipewire-jack-x86_64.conf /etc/ld.so.conf.d/

      - name: Final Cleanup
        run: |
          dnf --installroot=$(pwd)/build-rootfs clean all
          rm -rf ./build-rootfs/var/cache/dnf

      - name: Pack to SquashFS
        run: |
          mksquashfs ./build-rootfs fedora-kde-puppy.squashfs -b 1M -comp xz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kde-rootfs
          path: fedora-kde-puppy.squashfs
