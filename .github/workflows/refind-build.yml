name: Build Refind Secure Boot Bundle (precompiled shim + MOK + GRUB + WinPE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # --------------------------
      # Dependencies
      # --------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            gnu-efi \
            libssl-dev \
            sbsigntool \
            uuid-dev \
            wget \
            tar \
            mtools \
            grub-efi-amd64-bin

      # --------------------------
      # Generate MOK keys (100 years)
      # --------------------------
      - name: Generate MOK keys
        run: |
          mkdir keys
          cd keys
          openssl req -new -x509 -newkey rsa:4096 \
            -keyout MOK.key \
            -out MOK.crt \
            -days 18250 \
            -nodes \
            -subj "/CN=MOK Secure Boot Certificate/"

          openssl x509 -outform DER -in MOK.crt -out MOK.cer

      # --------------------------
      # Download precompiled shim + MokManager
      # --------------------------
      - name: Download shim
        run: |
          mkdir shim
          cd shim
          wget https://kojipkgs.fedoraproject.org/packages/shim/15.8/3/x86_64/shim-x64-15.8-3.x86_64.rpm
          rpm2cpio shim-x64-*.rpm | cpio -idmv
          find . -name "shimx64.efi" -exec cp {} ./BOOTX64.EFI \;
          find . -name "mmx64.efi" -exec cp {} ./mmx64.efi \;

      # --------------------------
      # Clone and build rEFInd
      # --------------------------
      - name: Build rEFInd
        run: |
          git clone https://github.com/rhboot/refind.git
          cd refind
          git submodule update --init --recursive
          make -f Makefile.gnu

      - name: Sign rEFInd with MOK
        run: |
          EFI_BIN=$(find refind -name refind_x64.efi | head -n1)
          sbsign \
            --key ../keys/MOK.key \
            --cert ../keys/MOK.crt \
            --output refind_x64.efi \
            "$EFI_BIN"

      # --------------------------
      # Build GRUB EFI with NVMe support
      # --------------------------
      - name: Build GRUB EFI
        run: |
          mkdir grub-build
          grub-mkstandalone \
            -O x86_64-efi \
            -o grub-build/grubx64.efi \
            --modules="part_gpt part_msdos fat ntfs ext2 chain linux normal configfile search search_fs_file nvme" \
            "boot/grub/grub.cfg=<(echo 'configfile /EFI/BOOT/grub.cfg')"

      - name: Sign GRUB with MOK
        run: |
          sbsign \
            --key keys/MOK.key \
            --cert keys/MOK.crt \
            --output grub-build/grubx64.efi \
            grub-build/grubx64.efi

      # --------------------------
      # Download wimboot
      # --------------------------
      - name: Download wimboot
        run: |
          wget https://github.com/ipxe/wimboot/releases/latest/download/wimboot

      # --------------------------
      # Create GRUB config for boot.wim
      # --------------------------
      - name: Create GRUB config
        run: |
          cat > grub.cfg << 'EOF'
          set timeout=5
          set default=0

          insmod nvme

          menuentry "Windows PE (boot.wim)" {
              insmod part_gpt
              insmod part_msdos
              insmod fat
              insmod ntfs
              insmod nvme

              search --file --set=root /boot/winpe/boot.wim

              linuxefi /EFI/BOOT/wimboot
              initrdefi /boot/winpe/boot.wim
              initrdefi /boot/winpe/boot.sdi
              initrdefi /boot/winpe/BCD
          }
          EOF

      # --------------------------
      # Prepare bundle layout
      # --------------------------
      - name: Prepare bundle
        run: |
          mkdir -p bundle/EFI/BOOT
          mkdir -p bundle/EFI/BOOT/refind
          mkdir -p bundle/boot/winpe
          mkdir -p bundle/keys

          # shim + MokManager
          cp shim/BOOTX64.EFI bundle/EFI/BOOT/
          cp shim/mmx64.efi bundle/EFI/BOOT/

          # rEFInd
          cp refind_x64.efi bundle/EFI/BOOT/
          cp -r refind/refind/* bundle/EFI/BOOT/refind/

          # GRUB
          cp grub-build/grubx64.efi bundle/EFI/BOOT/
          cp grub.cfg bundle/EFI/BOOT/

          # wimboot
          cp wimboot bundle/EFI/BOOT/

          # rEFInd config
          cat > bundle/EFI/BOOT/refind/refind.conf << 'EOF'
          timeout 5
          use_nvram false
          scanfor manual

          menuentry "GRUB (NVMe + WinPE)" {
              loader \EFI\BOOT\grubx64.efi
              icon \EFI\BOOT\refind\icons\os_linux.png
          }
          EOF

          # placeholders for Windows PE
          touch bundle/boot/winpe/boot.wim
          touch bundle/boot/winpe/boot.sdi
          touch bundle/boot/winpe/BCD

          # MOK keys
          cp keys/* bundle/keys/

      # --------------------------
      # Create deployable tarball
      # --------------------------
      - name: Create tarball
        run: |
          tar -czvf secureboot-bundle.tar.gz -C bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureboot-bundle
          path: secureboot-bundle.tar.gz
