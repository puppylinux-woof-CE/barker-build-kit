name: Build GRUB2 EFI Package for Puppy
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:sid
    
    steps:
    - name: Install dependencies
      run: |
        echo "deb-src http://deb.debian.org/debian/ sid main contrib non-free non-free-firmware" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y \
          build-essential autoconf automake bison flex libtool pkg-config \
          gettext autopoint python3 rsync texinfo \
          sbsigntool openssl xorriso xz-utils mtools dosfstools liblzma-dev libfreetype-dev \
          libnss3-dev gnu-efi unifont gawk cpio rpm wget rpm2cpio

    - name: Generate Secure Boot keys and Certificate
      run: |
        # Generate private key and PEM cert
        openssl req -new -x509 -newkey rsa:4096 \
          -keyout db.key -out db.crt -nodes -days 18250 \
          -subj "/CN=Puppy Linux Secure Boot Certificate/"
        
        # Convert PEM to DER (.cer) for UEFI enrollment
        openssl x509 -in db.crt -outform DER -out puppy.cer

    - name: Download Debian GRUB Source
      run: |
        # This downloads, extracts, and applies Debian's patches automatically
        mkdir grub-debian && cd grub-debian
        apt-get source grub2
        
        # Move the extracted directory to a fixed name for the next steps
        mv grub2-*/ ../grub

    - name: Build Patched GRUB
      run: |
        cd grub
        
        if [ -f ./bootstrap ]; then
          ./bootstrap
        elif [ -f ./autogen.sh ]; then
          ./autogen.sh
        else
          autoreconf -fvi
        fi
        
        # The Debian source now recognizes the configuration needed for their patches
        ./configure \
          --with-platform=efi \
          --target=x86_64 \
          --prefix=/ \
          --disable-werror

        export AWK=gawk
          
        make -j$(nproc)
        # Install to a local subdirectory to avoid permission/system issues
        make install DESTDIR=$(pwd)/output

    - name: Create advanced early.cfg
      run: |
        cat > early.cfg << 'EOF'
        # Load the font from the internal memdisk (managed by mkstandalone)
        loadfont (memdisk)/boot/grub/fonts/ascii.pf2
        
        # Set the graphics terminal
        insmod normal
        insmod all_video
        insmod gfxterm
        terminal_output gfxterm
        
        # Scan for existing configs
        for loc in /grub.cfg /boot/grub.cfg /boot/efi/grub.cfg /boot/efi/grub/grub.cfg /boot/efi/grub2/grub.cfg /grub/grub.cfg /grub2/grub.cfg; do
            search --file --set=root $loc
            if [ -f ($root)$loc ]; then
                configfile ($root)$loc
            fi
        done

        menuentry "GRUB Shell" { terminal_input console; terminal_output console }
        menuentry "Reboot" { reboot }
        menuentry "Poweroff" { halt }
        EOF

    - name: Build EFI binaries
      run: |
        GRUB_ROOT=$(pwd)/grub/output
        MODDIR=$GRUB_ROOT/lib/grub/x86_64-efi
        BINDIR=$GRUB_ROOT/bin

        cat > sbat.csv << 'EOF'
        sbat,1,SBAT Version,sbat,1,https://github.com/rhboot/shim/blob/main/SBAT.md
        grub,8,GRUB,grub,2.15,https://www.gnu.org/software/grub/
        puppy,8,Puppy Linux,puppy,26.01,https://puppylinux.com/
        EOF

        cat > bootx64.csv << 'EOF'
        shimx64.efi,puppy,,This is the boot entry for puppy
        EOF

        
        $BINDIR/grub-mkstandalone \
          -O x86_64-efi \
          --compress=xz \
          --sbat=sbat.csv \
          --directory=$MODDIR \
          --core-compress=xz \
          --fonts="ascii" \
          -o grubx64.efi \
          --modules="all_video boot btrfs cat chain configfile echo efifwsetup efinet efi_gop ext2 exfat f2fs fat font gettext gfxmenu gfxterm gfxterm_background gzio halt help hfsplus iso9660 jpeg keystatus loadenv loopback linux ls lsefi lsefimmap lsefisystab lssal memdisk minicmd normal ntfs part_apple part_msdos part_gpt password_pbkdf2 png probe reboot regexp search search_fs_uuid search_fs_file search_label sleep smbios squash4 test true udf video" \
          "boot/grub/grub.cfg=early.cfg"
        
    - name: Strip EFI binaries and modules
      run: |

        find . -type f -name "*.efi" | xargs -i strip --strip-unneeded '{}'        
        find grub/output/lib/grub/x86_64-efi -type f -name "*.mod" | xargs -i strip --strip-unneeded '{}'

    - name: Sign Grub EFI
      run: |

        sbsign --key db.key --cert db.crt --output grubx64.efi.signed grubx64.efi

    - name: Download prebuilt Microsoft-signed shim
      run: |
      
        mkdir shim-bin
        cd shim-bin

        SHIM_URL="https://kojipkgs.fedoraproject.org/packages/shim/16.1/8/x86_64/shim-x64-16.1-8.x86_64.rpm"

        # Example: Fedora signed shim RPM (contains shimx64.efi + mmx64.efi)
        wget -v -O shim.rpm $SHIM_URL

        # Extract RPM (no root needed)
        #rpm2cpio shim.rpm | cpio -idmv
        rpm2archive - < shim.rpm | tar -zxv
        
        find . -type f -name "*.efi" | xargs -i cp {} ../
        
    - name: Prepare ESP layout (Modules + Fonts + Cert)
      run: |
      
        mkdir -p esp/EFI/BOOT/grub/fonts
        mkdir -p esp/EFI/BOOT/grub/x86_64-efi
        mkdir -p esp/keys
        
        # Copy Binaries

        cp grubx64.efi.signed esp/EFI/BOOT/grubx64.efi

        for efi_file in mmx64.efi fbx64.efi shimx64.efi
        do
          cp ${efi_file} esp/EFI/BOOT/${efi_file}
        done

        #default boot
        cp shimx64.efi esp/EFI/BOOT/BOOTX64.EFI
        cp bootx64.csv esp/EFI/BOOT/BOOTX64.CSV
                
        # Copy Certificate for easy access
        cp puppy.cer esp/keys/puppy-enroll-me.cer
        
        # Copy Modules and Fonts
        cp -r grub/output/lib/grub/x86_64-efi/*.mod esp/EFI/BOOT/grub/x86_64-efi/
        cp -r grub/output/lib/grub/x86_64-efi/*.lst esp/EFI/BOOT/grub/x86_64-efi/
        cp grub/output/share/grub/*.pf2 esp/EFI/BOOT/grub/fonts/ || true

    - name: Package ESP tarball
      run: tar -cJf puppy-grub-efi-pack.tar.xz -C esp .
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: puppy-grub-build
        path: |
          puppy-grub-efi-pack.tar.xz
          puppy.cer
