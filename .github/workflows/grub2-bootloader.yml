name: Build GRUB2 (Debian Source) for Puppy
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        
        # This finds all active 'deb' lines and adds a 'deb-src' equivalent
        # works for both the old sources.list and the new .sources format
        sudo find /etc/apt/sources.list* -type f -exec sed -i 'p; s/^deb /deb-src /' {} +
        
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf automake bison flex libtool pkg-config \
          gettext autopoint python3 rsync texinfo sbsigntool openssl \
          xorriso xz-utils mtools dosfstools liblzma-dev libfreetype-dev \
          libnss3-dev gnu-efi unifont rpm2cpio cpio dpkg-dev

    - name: Download Debian GRUB Source
      run: |
        # This downloads, extracts, and applies Debian's patches automatically
        mkdir grub-debian && cd grub-debian
        apt-get source grub2
        # Move the extracted directory to a fixed name for the next steps
        mv grub2-*/ ../grub-src

    - name: Generate Secure Boot keys
      run: |
        openssl req -new -x509 -newkey rsa:4096 \
          -keyout db.key -out db.crt -nodes -days 18250 \
          -subj "/CN=Puppy Linux Secure Boot/"
        openssl x509 -in db.crt -outform DER -out puppy.cer

    - name: Build Patched GRUB
      run: |
        cd grub-src
        ./bootstrap
        # The Debian source now recognizes the configuration needed for their patches
        ./configure \
          --with-platform=efi \
          --target=x86_64 \
          --prefix=/ \
          --disable-werror
        make -j$(nproc)
        make install DESTDIR=$(pwd)/output

    - name: Create early.cfg
      run: |
        cat > early.cfg << 'EOF'
        set prefix=(memdisk)/boot/grub
        insmod normal
        normal
        EOF

    - name: Build Standalone EFI
      run: |
        GRUB_ROOT=$(pwd)/grub-src/output
        
        # Now --disable-shim-lock will actually BE recognized because we are
        # using the Debian-patched source code.
        $GRUB_ROOT/bin/grub-mkstandalone \
          -O x86_64-efi \
          --compress=xz \
          --directory=$GRUB_ROOT/lib/grub/x86_64-efi \
          --disable-shim-lock \
          -o grubx64.efi \
          --modules="part_gpt part_msdos fat ext2 linux chain search configfile normal" \
          "boot/grub/grub.cfg=early.cfg"

    - name: Sign and Package
      run: |
        # Sign the result
        sbsign --key db.key --cert db.crt --output grubx64.efi.signed grubx64.efi
        
        # Download Shim to wrap it
        mkdir shim-bin && cd shim-bin
        curl -LO https://kojipkgs.fedoraproject.org/packages/shim/16.1/7/x86_64/shim-x64-16.1-7.x86_64.rpm
        rpm2cpio shim-x64-*.rpm | cpio -idmv
        find . -type f -name "*.efi" | xargs -i cp {} ../
        cd ..

        # Prep ESP Structure
        mkdir -p esp/EFI/BOOT
        cp shimx64.efi esp/EFI/BOOT/BOOTX64.EFI
        cp grubx64.efi.signed esp/EFI/BOOT/grubx64.efi
        cp mmx64.efi esp/EFI/BOOT/mmx64.efi
        cp puppy.cer esp/EFI/BOOT/puppy.cer

        tar -cJf puppy-grub-payload.tar.xz -C esp .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: patched-grub-package
        path: |
          puppy-grub-payload.tar.xz
          puppy.cer
