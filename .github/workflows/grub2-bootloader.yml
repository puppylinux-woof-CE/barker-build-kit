name: Build GRUB2 Ultimate EFI Package
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf automake bison flex libtool pkg-config \
          gettext autopoint python3 rsync texinfo \
          sbsigntool openssl xorriso xz-utils mtools dosfstools liblzma-dev

    - name: Build GRUB from source
      run: |
        git clone --depth 1 https://git.savannah.gnu.org/git/grub.git
        cd grub
        ./bootstrap
        ./configure \
          --with-platform=efi \
          --target=x86_64 \
          --prefix=/ \
          --disable-werror
        make -j$(nproc)
        # Install to a local subdirectory to avoid permission/system issues
        make install DESTDIR=$(pwd)/output

    - name: Create advanced early.cfg
      run: |
        cat > early.cfg << 'EOF'
        # Scan for existing configs
        for loc in /grub.cfg /boot/grub.cfg /boot/efi/grub.cfg /boot/efi/grub/grub.cfg /boot/efi/grub2/grub.cfg; do
            search --file --set=root $loc
            if [ -f ($root)$loc ]; then
                configfile ($root)$loc
            fi
        done

        menuentry "GRUB Shell" { terminal_input console; terminal_output console }
        menuentry "Reboot" { reboot }
        menuentry "Poweroff" { halt }
        EOF

    - name: Build EFI binaries
      run: |
        GRUB_ROOT=$(pwd)/grub/output
        MODDIR=$GRUB_ROOT/lib/grub/x86_64-efi
        BINDIR=$GRUB_ROOT/bin
        
        $BINDIR/grub-mkstandalone \
          -O x86_64-efi \
          -C xz \
          --directory=$MODDIR \
          -o grubx64.efi \
          --modules="part_gpt part_msdos fat exfat ntfs ext2 f2fs btrfs hfsplus udf normal configfile search search_fs_file search_fs_uuid linux chain loopback iso9660 efi_gop gfxterm all_video font" \
          "boot/grub/grub.cfg=early.cfg"

        $BINDIR/grub-mkstandalone \
          -O x86_64-efi \
          -C xz \
          --directory=$MODDIR \
          -o mmx64.efi \
          --modules="part_gpt part_msdos fat exfat ntfs ext2 f2fs btrfs hfsplus udf normal search search_fs_file linux chain loopback iso9660 efi_gop gfxterm all_video"

    - name: Strip EFI binaries and modules
      run: |
        strip --strip-unneeded grubx64.efi || true
        strip --strip-unneeded mmx64.efi || true
        find grub/output/lib/grub/x86_64-efi -name "*.mod" -exec strip --strip-unneeded {} \; || true

    - name: Generate Secure Boot keys and Certificate
      run: |
        # Generate private key and PEM cert
        openssl req -new -x509 -newkey rsa:4096 \
          -keyout db.key -out db.crt -nodes -days 18250 \
          -subj "/CN=Puppy Linux Secure Boot Certificate/"
        
        # Convert PEM to DER (.cer) for UEFI enrollment
        openssl x509 -in db.crt -outform DER -out puppy.cer

    - name: Sign EFI
      run: |
        sbsign --key db.key --cert db.crt --output grubx64.efi.signed grubx64.efi
        sbsign --key db.key --cert db.crt --output mmx64.efi.signed mmx64.efi

    - name: Prepare ESP layout (Modules + Fonts + Cert)
      run: |
        mkdir -p esp/EFI/BOOT/grub/fonts
        mkdir -p esp/EFI/BOOT/grub/x86_64-efi
        mkdir -p esp/keys
        
        # Copy Binaries
        cp grubx64.efi.signed esp/EFI/BOOT/BOOTX64.EFI
        cp mmx64.efi.signed esp/EFI/BOOT/MMX64.EFI
        cp early.cfg esp/EFI/BOOT/grub/grub.cfg
        
        # Copy Certificate for easy access
        cp puppy.cer esp/keys/puppy-enroll-me.cer
        
        # Copy Modules and Fonts
        cp -r grub/output/lib/grub/x86_64-efi/*.mod esp/EFI/BOOT/grub/x86_64-efi/
        cp -r grub/output/lib/grub/x86_64-efi/*.lst esp/EFI/BOOT/grub/x86_64-efi/
        cp grub/output/share/grub/*.pf2 esp/EFI/BOOT/grub/fonts/ || true

    - name: Package ESP tarball
      run: tar -cJf grub-efi-ultimate-pack.tar.xz -C esp .

    - name: Create El Torito image
      run: |
        dd if=/dev/zero of=eltorito.img bs=1M count=60
        mkfs.vfat -F32 eltorito.img
        mmd -i eltorito.img ::/EFI ::/EFI/BOOT
        mcopy -i eltorito.img grubx64.efi.signed ::/EFI/BOOT/BOOTX64.EFI
        #mcopy -i eltorito.img mmx64.efi.signed ::/EFI/BOOT/MMX64.EFI

    - name: Package ISO assets
      run: tar -cJf grub2-iso-image.tar.xz eltorito.img

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grub-ultimate-build
        path: |
          grub-efi-ultimate-pack.tar.xz
          grub2-iso-image.tar.xz
          puppy.cer
          puppy.key
